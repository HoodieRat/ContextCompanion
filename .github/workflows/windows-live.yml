name: Native Windows live integration gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-live:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Set isolated data home on the runner
        shell: powershell
        run: |
          "CONTEXT_COMPANION_HOME=$(Join-Path $env:RUNNER_TEMP 'ContextCompanionLive')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install exact development requirements for controller regression tests
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install real isolated dependencies and require real smoke checks
        shell: powershell
        run: .\scripts\Install.ps1 -NoOpen
      - name: Run controller regression tests on native Windows
        shell: powershell
        run: .\scripts\Run-Tests.ps1
      - name: Preserve live evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-live-evidence
          if-no-files-found: warn
          path: |
            ${{ env.CONTEXT_COMPANION_HOME }}\verification\**\report.json
            ${{ env.CONTEXT_COMPANION_HOME }}\verification\latest.json
            ${{ env.CONTEXT_COMPANION_HOME }}\logs\*.txt
            ${{ env.CONTEXT_COMPANION_HOME }}\logs\jobs\*.log
            ${{ env.CONTEXT_COMPANION_HOME }}\dependency-licenses.json
      - name: Stop managed runtime
        if: always()
        shell: powershell
        run: .\scripts\Launch.ps1 -Action stop
